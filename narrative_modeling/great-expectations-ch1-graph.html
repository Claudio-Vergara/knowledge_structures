<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Great Expectations — Chapter I Narrative Graph</title>
<script src="https://d3js.org/d3.v7.min.js"></script>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: #0f1117; font-family: 'Segoe UI', sans-serif; color: #e0e0e0; overflow: hidden; }

  #title {
    position: absolute; top: 16px; left: 20px;
    font-size: 15px; font-weight: 600; letter-spacing: 0.04em;
    color: #c9d1d9;
  }
  #subtitle {
    position: absolute; top: 36px; left: 20px;
    font-size: 11px; color: #6e7681; letter-spacing: 0.06em;
  }

  #legend {
    position: absolute; top: 16px; right: 16px;
    background: rgba(22,27,34,0.92); border: 1px solid #30363d;
    border-radius: 8px; padding: 12px 16px; min-width: 200px;
    font-size: 11.5px;
  }
  #legend h3 { font-size: 11px; color: #8b949e; text-transform: uppercase;
    letter-spacing: 0.08em; margin-bottom: 8px; }
  .legend-section { margin-bottom: 10px; }
  .legend-section h4 { font-size: 10px; color: #6e7681; margin-bottom: 5px; text-transform: uppercase; }
  .legend-row { display: flex; align-items: center; gap: 8px; margin-bottom: 4px; }
  .legend-dot { width: 12px; height: 12px; border-radius: 50%; flex-shrink: 0; }
  .legend-rect { width: 14px; height: 10px; border-radius: 2px; flex-shrink: 0; }
  .legend-diamond { width: 12px; height: 12px; transform: rotate(45deg); flex-shrink: 0; }
  .legend-line { width: 24px; height: 2px; flex-shrink: 0; }
  .legend-label { color: #c9d1d9; }

  #info-panel {
    position: absolute; bottom: 16px; left: 16px;
    background: rgba(22,27,34,0.92); border: 1px solid #30363d;
    border-radius: 8px; padding: 10px 14px;
    font-size: 11.5px; min-width: 240px; max-width: 320px;
    display: none;
  }
  #info-panel h4 { color: #58a6ff; margin-bottom: 4px; font-size: 12px; }
  #info-panel p { color: #8b949e; line-height: 1.5; }

  #controls {
    position: absolute; bottom: 16px; right: 16px;
    display: flex; gap: 6px; flex-direction: column; align-items: flex-end;
  }
  button {
    background: #21262d; border: 1px solid #30363d; color: #c9d1d9;
    padding: 5px 10px; border-radius: 5px; cursor: pointer; font-size: 11px;
  }
  button:hover { background: #30363d; }

  #stats {
    position: absolute; top: 70px; left: 20px;
    font-size: 10.5px; color: #6e7681; line-height: 1.8;
  }

  .node { cursor: pointer; }
  .node:hover { filter: brightness(1.3); }
  .node-label {
    font-size: 9.5px; fill: #c9d1d9; pointer-events: none;
    text-anchor: middle; dominant-baseline: middle;
  }
  .edge-label {
    font-size: 8px; fill: #6e7681; pointer-events: none;
  }
  .link { stroke-opacity: 0.75; }
  .link:hover { stroke-opacity: 1; }

  .tooltip {
    position: absolute; background: rgba(22,27,34,0.97);
    border: 1px solid #58a6ff; border-radius: 6px;
    padding: 8px 11px; font-size: 11px; pointer-events: none;
    max-width: 260px; line-height: 1.5; display: none;
    z-index: 100;
  }
  .tooltip strong { color: #58a6ff; display: block; margin-bottom: 3px; }
</style>
</head>
<body>

<div id="title">Great Expectations — Chapter I</div>
<div id="subtitle">NARRATIVE GRAPH · Text2Story / INESC-TEC</div>
<div id="stats">
  Nodes: 23 &nbsp;|&nbsp; Edges: 46 &nbsp;|&nbsp; Actors: 8 &nbsp;|&nbsp; Events: 12 &nbsp;|&nbsp; Time: 3
</div>

<div id="legend">
  <h3>Legend</h3>
  <div class="legend-section">
    <h4>Node Types</h4>
    <div class="legend-row"><div class="legend-dot" style="background:#58a6ff;"></div><span class="legend-label">Actor (person)</span></div>
    <div class="legend-row"><div class="legend-dot" style="background:#bc8cff; border-radius:2px; transform:none; width:14px; height:14px;"></div><span class="legend-label">Actor (abstract)</span></div>
    <div class="legend-row"><div class="legend-rect" style="background:#3fb950;"></div><span class="legend-label">Event</span></div>
    <div class="legend-row"><div class="legend-diamond" style="background:#e3b341; border-radius:2px;"></div><span class="legend-label">Time expression</span></div>
  </div>
  <div class="legend-section">
    <h4>Edge Types</h4>
    <div class="legend-row"><div class="legend-line" style="background:#58a6ff;"></div><span class="legend-label">Semantic role</span></div>
    <div class="legend-row"><div class="legend-line" style="background:#e3b341;"></div><span class="legend-label">Temporal</span></div>
    <div class="legend-row"><div class="legend-line" style="background:#f85149;"></div><span class="legend-label">Causal</span></div>
    <div class="legend-row"><div class="legend-line" style="background:#bc8cff; border-style:dashed; height:1px;"></div><span class="legend-label">Subordination</span></div>
  </div>
</div>

<div class="tooltip" id="tooltip"></div>
<div id="info-panel"><h4 id="info-title"></h4><p id="info-body"></p></div>

<div id="controls">
  <button onclick="resetZoom()">Reset view</button>
  <button onclick="toggleLabels()">Toggle labels</button>
  <button onclick="toggleEdgeLabels()">Edge labels</button>
</div>

<svg id="svg"></svg>

<script>
const graphData = {
  nodes: [
    { id: "A1", label: "Pip", fullLabel: "Pip (Philip Pirrip)", type: "actor", subtype: "person" },
    { id: "A2", label: "Convict", fullLabel: "Convict (Abel Magwitch)", type: "actor", subtype: "person" },
    { id: "A3", label: "Father", fullLabel: "Pip's father", type: "actor", subtype: "person" },
    { id: "A4", label: "Mother", fullLabel: "Pip's mother", type: "actor", subtype: "person" },
    { id: "A5", label: "Brothers", fullLabel: "Pip's five brothers", type: "actor", subtype: "person" },
    { id: "A6", label: "Mrs Joe", fullLabel: "Mrs Joe Gargery", type: "actor", subtype: "person" },
    { id: "A7", label: "Joe", fullLabel: "Joe Gargery", type: "actor", subtype: "person" },
    { id: "A8", label: "Marshes", fullLabel: "The marshes", type: "actor", subtype: "abstract" },
    { id: "E1", label: "E1", fullLabel: "Pip establishes his identity", type: "event" },
    { id: "E2", label: "E2", fullLabel: "Pip visits the churchyard", type: "event" },
    { id: "E3", label: "E3", fullLabel: "Pip forms impression from tombstones", type: "event" },
    { id: "E4", label: "E4", fullLabel: "Parents & brothers die / are buried", type: "event" },
    { id: "E5", label: "E5", fullLabel: "Pip perceives the bleak marshes", type: "event" },
    { id: "E6", label: "E6", fullLabel: "Convict seizes Pip", type: "event" },
    { id: "E7", label: "E7", fullLabel: "Convict threatens Pip, demands food & file", type: "event" },
    { id: "E8", label: "E8", fullLabel: "Convict tilts Pip upside-down", type: "event" },
    { id: "E9", label: "E9", fullLabel: "Pip cries out in terror", type: "event" },
    { id: "E10", label: "E10", fullLabel: "Pip agrees to bring food & file", type: "event" },
    { id: "E11", label: "E11", fullLabel: "Convict limps away to the river", type: "event" },
    { id: "E12", label: "E12", fullLabel: "Pip is raised by Mrs Joe", type: "event" },
    { id: "T1", label: "T1", fullLabel: "Late afternoon / dusk", type: "time" },
    { id: "T2", label: "T2", fullLabel: "Before the chapter (Pip's early childhood)", type: "time" },
    { id: "T3", label: "T3", fullLabel: "Next morning (Pip's promise deadline)", type: "time" }
  ],
  edges: [
    { source: "A1", target: "E1", relation: "agent", link_type: "SemanticRoleLink" },
    { source: "A1", target: "E2", relation: "agent", link_type: "SemanticRoleLink" },
    { source: "A1", target: "E3", relation: "experiencer", link_type: "SemanticRoleLink" },
    { source: "A3", target: "E3", relation: "theme", link_type: "SemanticRoleLink" },
    { source: "A4", target: "E3", relation: "theme", link_type: "SemanticRoleLink" },
    { source: "A3", target: "E4", relation: "patient", link_type: "SemanticRoleLink" },
    { source: "A4", target: "E4", relation: "patient", link_type: "SemanticRoleLink" },
    { source: "A5", target: "E4", relation: "patient", link_type: "SemanticRoleLink" },
    { source: "A1", target: "E5", relation: "experiencer", link_type: "SemanticRoleLink" },
    { source: "A8", target: "E5", relation: "theme", link_type: "SemanticRoleLink" },
    { source: "A2", target: "E6", relation: "agent", link_type: "SemanticRoleLink" },
    { source: "A1", target: "E6", relation: "patient", link_type: "SemanticRoleLink" },
    { source: "A2", target: "E7", relation: "agent", link_type: "SemanticRoleLink" },
    { source: "A1", target: "E7", relation: "patient", link_type: "SemanticRoleLink" },
    { source: "A2", target: "E8", relation: "agent", link_type: "SemanticRoleLink" },
    { source: "A1", target: "E8", relation: "patient", link_type: "SemanticRoleLink" },
    { source: "A1", target: "E9", relation: "agent", link_type: "SemanticRoleLink" },
    { source: "A1", target: "E10", relation: "agent", link_type: "SemanticRoleLink" },
    { source: "A2", target: "E10", relation: "beneficiary", link_type: "SemanticRoleLink" },
    { source: "A2", target: "E11", relation: "agent", link_type: "SemanticRoleLink" },
    { source: "A6", target: "E12", relation: "agent", link_type: "SemanticRoleLink" },
    { source: "A7", target: "E12", relation: "co-agent", link_type: "SemanticRoleLink" },
    { source: "A1", target: "E12", relation: "patient", link_type: "SemanticRoleLink" },
    { source: "E4", target: "E12", relation: "BEFORE", link_type: "TemporalLink" },
    { source: "E4", target: "E2", relation: "BEFORE", link_type: "TemporalLink" },
    { source: "E1", target: "E2", relation: "BEFORE", link_type: "TemporalLink" },
    { source: "E2", target: "E3", relation: "INCLUDES", link_type: "TemporalLink" },
    { source: "E2", target: "E5", relation: "INCLUDES", link_type: "TemporalLink" },
    { source: "E5", target: "E6", relation: "BEFORE", link_type: "TemporalLink" },
    { source: "E6", target: "E7", relation: "BEFORE", link_type: "TemporalLink" },
    { source: "E7", target: "E8", relation: "INCLUDES", link_type: "TemporalLink" },
    { source: "E8", target: "E9", relation: "BEFORE", link_type: "TemporalLink" },
    { source: "E9", target: "E10", relation: "BEFORE", link_type: "TemporalLink" },
    { source: "E10", target: "E11", relation: "BEFORE", link_type: "TemporalLink" },
    { source: "E11", target: "T3", relation: "BEFORE", link_type: "TemporalLink" },
    { source: "T1", target: "E5", relation: "INCLUDES", link_type: "TemporalLink" },
    { source: "T2", target: "E4", relation: "INCLUDES", link_type: "TemporalLink" },
    { source: "E4", target: "E3", relation: "ENABLES", link_type: "CausalLink" },
    { source: "E6", target: "E9", relation: "CAUSES", link_type: "CausalLink" },
    { source: "E7", target: "E10", relation: "CAUSES", link_type: "CausalLink" },
    { source: "E8", target: "E9", relation: "CAUSES", link_type: "CausalLink" },
    { source: "E10", target: "E11", relation: "ENABLES", link_type: "CausalLink" },
    { source: "E4", target: "E12", relation: "ENABLES", link_type: "CausalLink" },
    { source: "E7", target: "E8", relation: "PART-OF", link_type: "SubordinationLink" },
    { source: "E6", target: "E7", relation: "PART-OF", link_type: "SubordinationLink" },
    { source: "E2", target: "E3", relation: "PART-OF", link_type: "SubordinationLink" },
    { source: "E2", target: "E5", relation: "PART-OF", link_type: "SubordinationLink" }
  ]
};

const w = window.innerWidth, h = window.innerHeight;
const svg = d3.select("#svg").attr("width", w).attr("height", h);
const g = svg.append("g");

// Zoom
const zoom = d3.zoom().scaleExtent([0.2, 4]).on("zoom", e => g.attr("transform", e.transform));
svg.call(zoom);

// Colors
const nodeColor = d => {
  if (d.type === "time") return "#e3b341";
  if (d.type === "event") return "#3fb950";
  if (d.subtype === "abstract") return "#bc8cff";
  return "#58a6ff";
};
const edgeColor = d => ({
  SemanticRoleLink: "#58a6ff",
  TemporalLink: "#e3b341",
  CausalLink: "#f85149",
  SubordinationLink: "#bc8cff"
}[d.link_type] || "#888");

const edgeDash = d => d.link_type === "SubordinationLink" ? "5,3" : "none";

// Arrow markers
const linkTypes = ["SemanticRoleLink","TemporalLink","CausalLink","SubordinationLink"];
const markerColors = { SemanticRoleLink:"#58a6ff", TemporalLink:"#e3b341", CausalLink:"#f85149", SubordinationLink:"#bc8cff" };

svg.append("defs").selectAll("marker")
  .data(linkTypes).join("marker")
  .attr("id", d => `arrow-${d}`)
  .attr("viewBox", "0 -5 10 10")
  .attr("refX", 22).attr("refY", 0)
  .attr("markerWidth", 5).attr("markerHeight", 5)
  .attr("orient", "auto")
  .append("path")
  .attr("d", "M0,-5L10,0L0,5")
  .attr("fill", d => markerColors[d]);

// Force simulation
const simulation = d3.forceSimulation(graphData.nodes)
  .force("link", d3.forceLink(graphData.edges).id(d => d.id).distance(100))
  .force("charge", d3.forceManyBody().strength(-420))
  .force("center", d3.forceCenter(w / 2, h / 2))
  .force("collision", d3.forceCollide(36));

// Draw edges
const link = g.append("g").attr("class", "links")
  .selectAll("line")
  .data(graphData.edges).join("line")
  .attr("class", "link")
  .attr("stroke", edgeColor)
  .attr("stroke-width", d => d.link_type === "CausalLink" ? 2 : 1.2)
  .attr("stroke-dasharray", edgeDash)
  .attr("marker-end", d => `url(#arrow-${d.link_type})`);

// Edge labels (hidden by default)
let showEdgeLabels = false;
const edgeLabel = g.append("g").attr("class", "edge-labels")
  .selectAll("text")
  .data(graphData.edges).join("text")
  .attr("class", "edge-label")
  .attr("fill", edgeColor)
  .text(d => d.relation)
  .style("display", "none");

// Draw nodes
const node = g.append("g").attr("class", "nodes")
  .selectAll("g")
  .data(graphData.nodes).join("g")
  .attr("class", "node")
  .call(d3.drag()
    .on("start", (e, d) => { if (!e.active) simulation.alphaTarget(0.3).restart(); d.fx = d.x; d.fy = d.y; })
    .on("drag", (e, d) => { d.fx = e.x; d.fy = e.y; })
    .on("end", (e, d) => { if (!e.active) simulation.alphaTarget(0); d.fx = null; d.fy = null; }));

// Node shapes
node.each(function(d) {
  const sel = d3.select(this);
  if (d.type === "event") {
    sel.append("rect")
      .attr("x", -20).attr("y", -13)
      .attr("width", 40).attr("height", 26)
      .attr("rx", 4)
      .attr("fill", nodeColor(d))
      .attr("fill-opacity", 0.18)
      .attr("stroke", nodeColor(d))
      .attr("stroke-width", 1.5);
  } else if (d.type === "time") {
    sel.append("rect")
      .attr("x", -14).attr("y", -14)
      .attr("width", 28).attr("height", 28)
      .attr("fill", nodeColor(d))
      .attr("fill-opacity", 0.18)
      .attr("stroke", nodeColor(d))
      .attr("stroke-width", 1.5)
      .attr("transform", "rotate(45)");
  } else {
    const r = d.id === "A1" ? 22 : d.id === "A2" ? 18 : 14;
    sel.append("circle")
      .attr("r", r)
      .attr("fill", nodeColor(d))
      .attr("fill-opacity", 0.18)
      .attr("stroke", nodeColor(d))
      .attr("stroke-width", d.id === "A1" || d.id === "A2" ? 2.5 : 1.5);
  }
});

// Labels inside nodes
let showLabels = true;
const nodeLabel = node.append("text")
  .attr("class", "node-label")
  .text(d => d.label)
  .attr("font-size", d => d.id === "A1" || d.id === "A2" ? "10px" : "9px")
  .attr("font-weight", d => d.id === "A1" || d.id === "A2" ? "700" : "400");

// Tooltip
const tooltip = d3.select("#tooltip");
node.on("mouseover", (e, d) => {
    tooltip.style("display", "block")
      .style("left", (e.pageX + 12) + "px")
      .style("top", (e.pageY - 28) + "px")
      .html(`<strong>${d.id} · ${d.type.toUpperCase()}</strong>${d.fullLabel}`);
  })
  .on("mousemove", e => tooltip.style("left", (e.pageX + 12) + "px").style("top", (e.pageY - 28) + "px"))
  .on("mouseout", () => tooltip.style("display", "none"))
  .on("click", (e, d) => {
    const panel = document.getElementById("info-panel");
    const connected = graphData.edges
      .filter(ed => ed.source.id === d.id || ed.target.id === d.id)
      .map(ed => {
        const other = ed.source.id === d.id ? ed.target : ed.source;
        return `${ed.relation} → ${other.label || other.id}`;
      });
    document.getElementById("info-title").textContent = `${d.id}: ${d.fullLabel}`;
    document.getElementById("info-body").textContent = connected.length
      ? connected.join(" · ")
      : "No connections shown.";
    panel.style.display = "block";
    e.stopPropagation();
  });

svg.on("click", () => { document.getElementById("info-panel").style.display = "none"; });

// Simulation tick
simulation.on("tick", () => {
  link
    .attr("x1", d => d.source.x).attr("y1", d => d.source.y)
    .attr("x2", d => d.target.x).attr("y2", d => d.target.y);

  edgeLabel
    .attr("x", d => (d.source.x + d.target.x) / 2)
    .attr("y", d => (d.source.y + d.target.y) / 2);

  node.attr("transform", d => `translate(${d.x},${d.y})`);
});

function resetZoom() {
  svg.transition().duration(500).call(zoom.transform, d3.zoomIdentity.translate(0,0).scale(1));
}
function toggleLabels() {
  showLabels = !showLabels;
  nodeLabel.style("display", showLabels ? null : "none");
}
function toggleEdgeLabels() {
  showEdgeLabels = !showEdgeLabels;
  edgeLabel.style("display", showEdgeLabels ? null : "none");
}

window.addEventListener("resize", () => {
  const nw = window.innerWidth, nh = window.innerHeight;
  svg.attr("width", nw).attr("height", nh);
  simulation.force("center", d3.forceCenter(nw/2, nh/2)).alpha(0.3).restart();
});
</script>
</body>
</html>
